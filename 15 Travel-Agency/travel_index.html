<!DOCTYPE html>
<html>
<head>
    <title>Explore the World - Travel Agency</title>
</head>

<!-- Task 2: Three horizontal sections: Header 20%, Main Content 65%, Footer 15% -->
<frameset rows="20%,65%,15%" frameborder="1" border="2">

    <!-- Header -->
    <frame src="travel_header.html" name="header"
           scrolling="no" noresize frameborder="0"
           marginwidth="10" marginheight="5">

    <!-- Task 3: Main Content split into three columns using a nested frameset -->
    <frameset cols="25%,45%,30%" frameborder="1" border="2">

        <!-- Navigation (25%) -->
        <frame src="travel_nav.html" name="navigation"
               scrolling="no" noresize frameborder="1"
               marginwidth="15" marginheight="15">

        <!-- Tourist Destinations (45%) -->
        <frame src="travel_destinations.html" name="destinations"
               scrolling="auto" frameborder="1"
               marginwidth="20" marginheight="15">

        <!-- Travel Packages (30%) -->
        <frame src="travel_packages.html" name="packages"
               scrolling="auto" frameborder="1"
               marginwidth="15" marginheight="15">

    </frameset>

    <!-- Footer -->
    <frame src="travel_footer.html" name="footer"
           scrolling="no" noresize frameborder="0"
           marginwidth="10" marginheight="5">

    <noframes>
        <body>
            <p>Your browser does not support frames.</p>
        </body>
    </noframes>

</frameset>
</html>
